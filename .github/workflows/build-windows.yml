name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Update Rust stable
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - name: Toolchain version
        id: rust
        run: |
          $version = rustc +stable --version
          $version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            game/target
          key: windows-x86_64-msvc-${{ steps.rust.outputs.version }}-${{ hashFiles('game/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-x86_64-msvc-${{ steps.rust.outputs.version }}-${{ hashFiles('game/Cargo.lock') }}-
      - name: Build release binaries
        run: |
          cargo +stable build --manifest-path game/Cargo.toml --locked --release --target x86_64-pc-windows-msvc --features viewer --bins --message-format=json-render-diagnostics > "$env:RUNNER_TEMP/cargo-windows.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "Cargo build failed: $LASTEXITCODE" }
      - name: Package standalone directory
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'n-side-windows-x86_64-msvc'
          New-Item -ItemType Directory -Force "$package/game", "$package/source-assets/district-map", "$package/source-assets/district-scene", "$package/licenses" | Out-Null
          $executables = @(Get-Content "$env:RUNNER_TEMP/cargo-windows.jsonl" |
            Where-Object { $_.StartsWith('{') } |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.kind -contains 'bin' -and $_.executable } |
            Select-Object -ExpandProperty executable -Unique | Sort-Object)
          if ($executables.Count -eq 0) { throw 'Cargo reported no executable targets' }
          foreach ($executable in $executables) {
            if (!(Test-Path $executable -PathType Leaf) -or [IO.Path]::GetExtension($executable) -ne '.exe') { throw "Missing Windows executable: $executable" }
            Copy-Item $executable "$package/game/"
          }
          $executables | ForEach-Object { 'game/' + [IO.Path]::GetFileName($_) } | Set-Content "$package/executables.txt" -Encoding utf8
          Copy-Item game/assets "$package/game/" -Recurse
          Copy-Item source-assets/district-map/district.json "$package/source-assets/district-map/"
          Copy-Item source-assets/district-scene/appearance.json, source-assets/district-scene/daylight.json "$package/source-assets/district-scene/"
          Copy-Item source-assets/environment-kit/licenses/* "$package/licenses/"
          Copy-Item third_party/parry/LICENSE "$package/licenses/Parry-Apache-2.0.txt"
          Copy-Item source-assets/environment-kit/asset-manifest.json "$package/licenses/environment-assets.json"
          @('@echo off', 'cd /d "%~dp0"', 'game\n-side.exe --project-root "%CD%" %*', 'exit /b %errorlevel%') | Set-Content "$package/run-game.cmd" -Encoding ascii
          @('@echo off', 'cd /d "%~dp0"', 'game\n-side.exe --project-root "%CD%" --walk-preview %*', 'exit /b %errorlevel%') | Set-Content "$package/run-walk-preview.cmd" -Encoding ascii
          @('@echo off', 'cd /d "%~dp0"', 'game\map_viewer.exe --project-root "%CD%" %*', 'exit /b %errorlevel%') | Set-Content "$package/run-viewer.cmd" -Encoding ascii
          @(
            'N:SIDE - Windows x86_64 MSVC',
            'Extract the entire archive before starting either program.',
            'run-game.cmd: launch the title and district preview.',
            'run-viewer.cmd: launch the district viewer.',
            'All executable targets from this build are listed in executables.txt; launchers forward additional arguments.',
            'Game entry: arrows select, Enter confirms; Esc/Tab/Start/East opens pause in the district.',
            'UI font: Noto Sans SC, OFL 1.1; license and copyright are under game/assets/ui/licenses/.',
            'Viewer controls: right mouse to look, WASD to move, Q/E down/up, Shift faster, wheel speed, M capture mouse, Esc release.',
            'run-walk-preview.cmd: n-side.exe --walk-preview (not a separate binary); WASD/left stick move, right mouse/Q/E/right stick look, F/South inspect, R/Select reset.',
            'Requires Windows and a graphics driver supporting Vulkan.',
            'Collision queries: parry3d 0.30.2, Apache-2.0; license in licenses/Parry-Apache-2.0.txt.',
            'Environment assets: Kenney and ambientCG, CC0; license texts and source manifest are in licenses/.',
            "Commit: $env:GITHUB_SHA"
          ) | Set-Content "$package/README.txt" -Encoding utf8
          foreach ($file in @('run-game.cmd', 'run-walk-preview.cmd', 'run-viewer.cmd', 'executables.txt', 'licenses/Parry-Apache-2.0.txt', 'game/n-side.exe', 'game/map_viewer.exe', 'game/assets/ui/fonts/NotoSansSC-VF.ttf', 'game/assets/ui/licenses/OFL.txt', 'game/assets/ui/licenses/COPYRIGHT.txt', 'source-assets/district-map/district.json', 'source-assets/district-scene/appearance.json', 'source-assets/district-scene/daylight.json')) {
            if (!(Test-Path "$package/$file" -PathType Leaf)) { throw "Missing package file: $file" }
          }
      - name: Check Windows launchers
        run: |
          Push-Location (Join-Path $env:RUNNER_TEMP 'n-side-windows-x86_64-msvc')
          try {
            foreach ($launcher in @('run-game.cmd', 'run-walk-preview.cmd', 'run-viewer.cmd')) {
              & "./$launcher" --help
              if ($LASTEXITCODE -ne 0) { throw "Launcher failed: $launcher ($LASTEXITCODE)" }
              & "./$launcher" --invalid-package-probe
              if ($LASTEXITCODE -eq 0) { throw "Launcher swallowed invalid argument: $launcher" }
            }
            & ./run-viewer.cmd --validate
            if ($LASTEXITCODE -ne 0) { throw "Viewer launcher validation failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v7
        id: artifact
        with:
          name: n-side-windows-x86_64-msvc
          path: ${{ runner.temp }}/n-side-windows-x86_64-msvc/
          if-no-files-found: error
          retention-days: 14
      - name: Download link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          @(
            "[Download Windows package]($env:ARTIFACT_URL)",
            '',
            'Extract all files, then choose one launcher:',
            '- `run-game.cmd`: title and district preview',
            '- `run-walk-preview.cmd`: outdoor movement preview',
            '- `run-viewer.cmd`: map viewer',
            '',
            'Included executable targets:'
          ) >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP/n-side-windows-x86_64-msvc/executables.txt" | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
