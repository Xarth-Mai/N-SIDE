[package]
name = "n-side"
version = "0.1.0"
edition = "2024"
default-run = "n-side"

[features]
viewer = ["bevy/free_camera"]

[[bin]]
name = "map_viewer"
path = "src/bin/map_viewer.rs"
required-features = ["viewer"]

[dependencies]
bevy = { version = "0.19.1", features = ["jpeg", "dds"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
geo = { version = "0.33", default-features = false }
earcutr = "0.4"
spade = "2"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
